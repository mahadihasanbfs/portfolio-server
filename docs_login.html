<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Sign in · Bright Future Soft API</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --line:#e2e5ea; --text:#14181f; --muted:#626b7a; --accent:#4f46e5; --err:#c1272d; --errbg:#fde7e8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1017; --panel:#151a23; --line:#262d3a; --text:#e8ebf1; --muted:#8f99aa; --accent:#8b87ff; --err:#ff7b80; --errbg:#3d1618; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--text);
         font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
  .box { width:100%; max-width:380px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:28px; }
  .logo { width:34px; height:34px; border-radius:9px; background:var(--accent); color:#fff; display:grid; place-items:center; font-weight:700; margin-bottom:14px; }
  h1 { font-size:20px; margin:0 0 4px; letter-spacing:-.01em; }
  p { margin:0 0 20px; color:var(--muted); font-size:14px; }
  label { display:block; font-size:13px; font-weight:600; margin:14px 0 6px; }
  input { width:100%; height:42px; padding:0 12px; border-radius:9px; border:1px solid var(--line); background:transparent; color:var(--text); font:inherit; outline:none; }
  input:focus { border-color:var(--accent); }
  button { width:100%; height:42px; margin-top:20px; border:0; border-radius:9px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .err { display:none; margin-top:14px; padding:9px 12px; border-radius:8px; background:var(--errbg); color:var(--err); font-size:13.5px; }
</style>
</head>
<body>
  <form class="box" id="f">
    <div class="logo">B</div>
    <h1>API documentation</h1>
    <p>Sign in with your Bright Future Soft account to continue.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required autofocus />
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required />
    <div class="err" id="err" role="alert"></div>
    <button id="go" type="submit">Sign in</button>
  </form>
<script>
  const f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.style.display = 'none'; go.disabled = true; go.textContent = 'Signing in…';
    try {
      const r = await fetch('/docs/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: f.email.value.trim(), password: f.password.value })
      });
      const d = await r.json();
      if (d.success) return location.reload();
      err.textContent = d.message || 'Sign in failed';
    } catch { err.textContent = 'Network error. Try again.'; }
    err.style.display = 'block'; go.disabled = false; go.textContent = 'Sign in';
  });
</script>
</body>
</html>
